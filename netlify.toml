[build]
  base    = "astro-app"
  command = "npm run build"
  publish = "dist"

# Long-lived cache for hashed JS/CSS bundles
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images for 30 days
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# No cache for HTML (always fresh so new deploys take effect immediately)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirects from URLs of the previous website (/de/... and /ru/...)
[[redirects]]
  from   = "/de/home"
  to     = "/"
  status = 301

[[redirects]]
